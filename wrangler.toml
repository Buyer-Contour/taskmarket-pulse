name = "taskmarket-pulse"
main = "src/worker.mjs"
compatibility_date = "2026-11-25"
workers_dev = true
send_metrics = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/api/pulse"]

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "PULSE"

[[workflows]]
name = "taskmarket-pulse-refresh"
binding = "REFRESH"
class_name = "RefreshPulse"
